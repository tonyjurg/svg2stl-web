name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: Use case
      description: What workflow or supported SVG case would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected input, output, and user-visible behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing editor or slicer workarounds you have tried
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I reviewed the documented SVG limitations.
          required: true
        - label: I searched existing issues and requests.
          required: true
