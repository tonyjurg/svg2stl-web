name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install audit tooling
        run: python -m pip install ".[audit]"
      - name: Audit Python dependencies
        run: python -m pip_audit --strict --progress-spinner off .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Gmsh runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa libgomp1
      - name: Install project
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build container image
        run: docker build --tag svg2stl-web:test .
